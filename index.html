<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSHY_DESKTOP // OS v1.0</title>
  
  <!-- Web App Manifest for PWA Support -->
  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;: &quot;nshy-desktop&quot;,
    &quot;short_name&quot;: &quot;nshy OS&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#e5e5e7&quot;,
    &quot;theme_color&quot;: &quot;#d1d1d6&quot;
  }">

  <style>
    :root {
      --bg-color: #e8e8ea;
      --panel-bg: #ffffff;
      --border-dark: #7a7a80;
      --border-light: #ffffff;
      --text-main: #121214;
      --text-muted: #6e6e73;
      --accent-gray: #d4d4d8;
      --accent-hover: #b8b8c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-image: 
        radial-gradient(var(--border-dark) 0.75px, transparent 0.75px),
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 16px 16px, 100% 100%;
    }

    /* Top Frame Bar */
    .header-frame {
      border: 2px solid var(--border-dark);
      background: var(--panel-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 1px 1px 0px var(--border-light), 3px 3px 0px rgba(0,0,0,0.15);
    }

    .title-block h1 {
      font-size: 1.25rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .status-block {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Main Desktop Grid */
    .grid-layout {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      gap: 12px;
      flex-grow: 1;
    }

    /* Panels & Retro Framing */
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-dark);
      box-shadow: inset 1px 1px 0px var(--border-light), 3px 3px 0px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: var(--accent-gray);
      padding: 6px 10px;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Navigation Link Box */
    .link-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .link-list li a {
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border-dark);
      background: #f4f4f6;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.1s ease;
    }

    .link-list li a:hover {
      background: var(--text-main);
      color: var(--panel-bg);
    }

    /* Photobooth Styling */
    .booth-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #webcam-view {
      width: 100%;
      height: 190px;
      background: #111;
      object-fit: cover;
      filter: grayscale(100%) contrast(115%);
      border: 2px solid var(--border-dark);
    }

    .booth-controls {
      display: flex;
      gap: 8px;
    }

    /* Inputs & UI Controls */
    textarea {
      width: 100%;
      height: 100%;
      min-height: 200px;
      background: #fafafa;
      border: 1px solid var(--border-dark);
      padding: 10px;
      color: var(--text-main);
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
    }

    input[type="text"] {
      width: 100%;
      background: #fafafa;
      border: 1px solid var(--border-dark);
      padding: 6px 8px;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }

    button {
      background: var(--accent-gray);
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 1px 1px 0px var(--border-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      box-shadow: inset -1px -1px 0px var(--border-light);
    }

    /* Reminders List Styling */
    .reminder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #f4f4f6;
      border: 1px solid var(--border-dark);
      font-size: 0.85rem;
    }

    .reminder-item span {
      word-break: break-all;
    }

    .remove-btn {
      background: transparent;
      border: none;
      box-shadow: none;
      color: var(--text-muted);
      padding: 0 4px;
      font-size: 1rem;
    }

    .remove-btn:hover {
      color: var(--text-main);
      background: transparent;
    }

    @media (max-width: 850px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top System Header -->
  <header class="header-frame">
    <div class="title-block">
      <h1>nshy-desktop // root</h1>
    </div>
    <div class="status-block">
      <span>STATE: ONLINE</span>
      <span id="clock">00:00:00</span>
    </div>
  </header>

  <!-- Desktop Interactive Workspace -->
  <main class="grid-layout">
    
    <!-- Left Navigation Frame -->
    <section class="panel">
      <div class="panel-header">
        <span>[ LINKS ]</span>
        <span>01</span>
      </div>
      <div class="panel-body">
        <ul class="link-list">
          <li><a href="https://github.com" target="_blank"><span>></span> GITHUB</a></li>
          <li><a href="https://notion.so" target="_blank"><span>></span> NOTION</a></li>
          <li><a href="https://youtube.com" target="_blank"><span>></span> YOUTUBE</a></li>
          <li><a href="https://pinterest.com" target="_blank"><span>></span> PINTEREST</a></li>
        </ul>
      </div>
    </section>

    <!-- Center Interactive Workspace (Notes + Photobooth) -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      
      <!-- Private Scratchpad -->
      <section class="panel" style="flex-grow: 1;">
        <div class="panel-header">
          <span>[ NOTES ]</span>
          <span>02</span>
        </div>
        <div class="panel-body">
          <textarea id="notes-input" placeholder="Start typing... Everything here auto-saves locally to your machine."></textarea>
        </div>
      </section>

      <!-- WebRTC Monochromatic Photobooth -->
      <section class="panel">
        <div class="panel-header">
          <span>[ PHOTOBOOTH ]</span>
          <span>03</span>
        </div>
        <div class="panel-body booth-container">
          <video id="webcam-view" autoplay playsinline></video>
          <div class="booth-controls">
            <button onclick="startCamera()">START CAM</button>
            <button onclick="takeSnapshot()">CAPTURE</button>
          </div>
        </div>
      </section>

    </div>

    <!-- Right Reminders Frame -->
    <section class="panel">
      <div class="panel-header">
        <span>[ REMINDERS ]</span>
        <span>04</span>
      </div>
      <div class="panel-body">
        <div style="display: flex; gap: 6px;">
          <input type="text" id="reminder-input" placeholder="New task..." onkeydown="if(event.key==='Enter') addReminder()">
          <button onclick="addReminder()">ADD</button>
        </div>
        <div id="reminder-list" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;"></div>
      </div>
    </section>

  </main>

  <script>
    // Live Clock Update
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Persistent Notes via localStorage
    const notesInput = document.getElementById('notes-input');
    notesInput.value = localStorage.getItem('nshy_notes') || '';
    notesInput.addEventListener('input', () => {
      localStorage.setItem('nshy_notes', notesInput.value);
    });

    // Local Reminders System
    function loadReminders() {
      const items = JSON.parse(localStorage.getItem('nshy_reminders') || '[]');
      const container = document.getElementById('reminder-list');
      container.innerHTML = '';
      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'reminder-item';
        div.innerHTML = `
          <span>• ${escapeHtml(item)}</span>
          <button class="remove-btn" onclick="removeReminder(${index})">×</button>
        `;
        container.appendChild(div);
      });
    }

    function addReminder() {
      const input = document.getElementById('reminder-input');
      if (!input.value.trim()) return;
      const items = JSON.parse(localStorage.getItem('nshy_reminders') || '[]');
      items.push(input.value.trim());
      localStorage.setItem('nshy_reminders', JSON.stringify(items));
      input.value = '';
      loadReminders();
    }

    function removeReminder(index) {
      const items = JSON.parse(localStorage.getItem('nshy_reminders') || '[]');
      items.splice(index, 1);
      localStorage.setItem('nshy_reminders', JSON.stringify(items));
      loadReminders();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    loadReminders();

    // Camera / Photobooth Module
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('webcam-view').srcObject = stream;
      } catch (err) {
        alert('Webcam permission denied or unavailable.');
      }
    }

    function takeSnapshot() {
      const video = document.getElementById('webcam-view');
      if (!video.srcObject) {
        alert('Please start the camera first.');
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      
      // Apply monochrome filter onto captured frame
      ctx.filter = 'grayscale(100%) contrast(115%)';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const imgUrl = canvas.toDataURL('image/png');
      const win = window.open();
      if (win) {
        win.document.write(`
          <html style="background:#000; display:flex; justify-content:center; align-items:center; height:100vh;">
            <body style="margin:0;">
              <img src="${imgUrl}" style="border: 2px solid #fff; max-width: 90vw;"/>
            </body>
          </html>
        `);
      }
    }
  </script>
</body>
</html>
